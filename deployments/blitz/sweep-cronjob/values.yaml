schedule: "*/15 * * * *"
concurrencyPolicy: Forbid
backoffLimit: 2
ttlSecondsAfterFinished: 300

image:
  repository: qingchun22/blitz-sweep-arm64
  pullPolicy: Always
  tag: ""

env:
  BTC_RPC_HOST: "blitz-btc-node:18443/wallet/blitz_wallet"
  ETH_RPC_HOST: "http://blitz-eth-node:8545"
  BTC_NETWORK: "regtest"
  COLD_WALLET_BTC: ""
  COLD_WALLET_ETH: ""
  HOT_WALLET_KEEP_BTC: "0.01"
  HOT_WALLET_KEEP_ETH: "0.1"
  SWEEP_BTC_FEE_BUFFER: "0.0001"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
